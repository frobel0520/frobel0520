name: Update language stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=PowerShell,VBScript,Dockerfile,Batchfile&hide_title=true&card_width=600&bg_color=ffffff&text_color=59636e&border_color=d1d9e0&border_radius=6&disable_animations=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=PowerShell,VBScript,Dockerfile,Batchfile&hide_title=true&card_width=600&bg_color=0d1117&text_color=9198a1&border_color=3d444d&border_radius=6&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Apply distinct Python and JavaScript colors
        shell: bash
        run: |
          sed -i \
            -e 's/#3572A5/#FFD43B/g' \
            -e 's/#f1e05a/#323330/g' \
            profile/top-langs-light.svg
          sed -i \
            -e 's/#3572A5/#FFD43B/g' \
            -e 's/#f1e05a/#E5E7EB/g' \
            profile/top-langs-dark.svg
          grep -q '#FFD43B' profile/top-langs-light.svg
          grep -q '#FFD43B' profile/top-langs-dark.svg
          grep -q '#323330' profile/top-langs-light.svg
          grep -q '#E5E7EB' profile/top-langs-dark.svg

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs-light.svg profile/top-langs-dark.svg
          git commit -m "Update language stats" || exit 0
          git push
